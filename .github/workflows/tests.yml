name: Tests

# Tests only. Nothing merges by itself: the owner approves every change and merges it.

on:
  push:
    branches: [main]
  pull_request:

# Only the newest push to a pull request is tested: a newer push cancels the run still going for the one before it,
# so each update spends its minutes once (GitHub's free minutes are limited for a private repository).
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: stratlab/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stratlab/backend/requirements.txt
      - run: pip install -r requirements.txt pytest time-machine pytest-xdist
      - run: pytest -q -n auto

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: stratlab/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stratlab/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  browser:
    # every main page on desktop and phone against the fake world, checking what is drawn (e2e/pages.spec.ts).
    # The slowest job, so it starts only once the frontend builds: a build that fails costs no browser minutes.
    needs: [frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stratlab/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: stratlab/frontend/package-lock.json
      - run: pip install -r requirements.txt pytest
        working-directory: stratlab/backend
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: stratlab/frontend
      - run: npm run e2e
        working-directory: stratlab/frontend
        env:
          CI: "1"
          PYTHON: python
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-screenshots
          path: stratlab/frontend/test-results/
