name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stratlab/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stratlab/backend/requirements.txt
      - run: pip install -r requirements.txt pytest time-machine
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stratlab/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: stratlab/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  browser:
    # every main page on desktop and phone against the fake world, checking what is drawn (e2e/pages.spec.ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: stratlab/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: stratlab/frontend/package-lock.json
      - run: pip install -r requirements.txt pytest
        working-directory: stratlab/backend
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: stratlab/frontend
      - run: npm run e2e
        working-directory: stratlab/frontend
        env:
          CI: "1"
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-screenshots
          path: stratlab/frontend/test-results/

  merge:
    # Claude's own pull requests merge themselves once backend, frontend and browser have passed and the Vercel preview
    # has built; Railway and Vercel then deploy main. Skipped: a pull request that changes .github (Claude merges those
    # itself once green), is a draft, carries the "hold" label, is behind main, or has newer commits still being tested.
    needs: [backend, frontend, browser]
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Merge when everything has passed
        run: |
          hold() { echo "::notice::Not merged automatically: $1."; exit 0; }
          pr=$(gh api "repos/$REPO/pulls/$PR")
          [ "$(jq -r .state <<<"$pr")" = open ] || hold "the pull request is already closed"
          [ "$(jq -r .draft <<<"$pr")" = false ] || hold "it is a draft"
          [ "$(jq -r .head.sha <<<"$pr")" = "$SHA" ] || hold "newer commits are being tested"
          jq -e '[.labels[].name] | index("hold")' <<<"$pr" >/dev/null && hold 'it carries the "hold" label'
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          grep -q '^\.github/' <<<"$files" && hold "it changes .github"
          [ "$(gh api "repos/$REPO/compare/$BASE...$SHA" --jq .behind_by)" = 0 ] || hold "it is behind $BASE"
          for i in $(seq 60); do
            state=$(gh api "repos/$REPO/commits/$SHA/status" --jq 'if .total_count == 0 then "success" else .state end')
            [ "$state" = success ] && break
            [ "$state" = pending ] || hold "the Vercel preview reports $state"
            sleep 15
          done
          [ "$state" = success ] || hold "the Vercel preview is still building after 15 minutes"
          gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=merge -f sha="$SHA" >/dev/null || hold "GitHub refused the merge"
          echo "::notice::Merged pull request #$PR."
