name: Claude builder

# The owner's builder on GitHub's runners: an issue or comment by the repository owner that mentions @claude starts Claude Code on the
# task; it works on a branch and opens a pull request. It runs on the ANTHROPIC_API_KEY repository secret (the owner's API credits).
# Only the owner's own issues and comments start it.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-builder-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

# nothing by default; the job below asks for what it needs itself
permissions: {}

jobs:
  claude:
    if: >-
      github.actor == 'prakul1982' && (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Backend dependencies (so the builder can run the tests)
        run: pip install -r stratlab/backend/requirements.txt pytest pytest-xdist
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 120
            --append-system-prompt "Repository rules: facts only in any user-facing text, no advice wording. Fix things generically for every
            sector, India and US. Never skip, disable or weaken a test. Before pushing, run the backend tests:
            cd stratlab/backend && python -m pytest -q -n 4 -p no:cacheprovider tests/ . Commit messages end with the line
            Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>. Never put secrets in code, commits or comments."
