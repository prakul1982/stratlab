name: Database backup

# A copy of the main database every night, kept as an encrypted download on this repository's Actions page
# (7 days; Sunday's copy, which also holds the recorded option chains, 28 days). Restoring: docs/ADMIN.md → Backups.
# Needs BACKUP_PASSPHRASE and where to copy from:
#  - APP_DB_URL: Railway's Postgres (its public connection URL), once users' data has moved there (Admin → Storage).
#    The nightly copy is its `app` schema (users' data); Sunday's also has `public` (the market data and option chains).
#  - SUPABASE_DB_URL (Supabase → Connect → Session pooler): the sign-ins, and before the move the app's tables too.

on:
  schedule:
    - cron: "40 20 * * *"        # 02:10 in India, when nobody is using the site
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_DB_URL: ${{ secrets.APP_DB_URL }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$PASSPHRASE" ] || { [ -z "$APP_DB_URL" ] && [ -z "$DB_URL" ]; }; then
            echo "::error::Add the repository secrets BACKUP_PASSPHRASE and APP_DB_URL (or SUPABASE_DB_URL) (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install pg_dump
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          # the client must be at least the server's version: Railway's may be newer than Supabase's
          major=17
          if [ -n "$APP_DB_URL" ]; then
            sudo apt-get install -y -q postgresql-client-17 >/dev/null
            v=$(/usr/lib/postgresql/17/bin/psql "$APP_DB_URL" -tAc 'show server_version_num' | cut -c1-2)
            if [ -n "$v" ] && [ "$v" -gt 17 ]; then major=$v; fi
          fi
          sudo apt-get install -y -q "postgresql-client-$major" >/dev/null
          echo "PG=/usr/lib/postgresql/$major/bin" >> "$GITHUB_ENV"

      - name: Copy the database
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          if [ "$(date -u +%u)" = 7 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then full=1; else full=0; fi
          mkdir out
          moved=0
          if [ -n "$APP_DB_URL" ] && $PG/psql "$APP_DB_URL" -tAc "select value from public.app_settings where key = 'maindb:state'" | grep -q '"done"'; then
            moved=1
          elif [ -n "$APP_DB_URL" ] && [ -z "$DB_URL" ]; then
            echo "::error::Users' data hasn't moved to Railway yet (Admin → Storage), and SUPABASE_DB_URL isn't set to copy it from Supabase."
            exit 1
          fi
          if [ "$moved" = 0 ] && [ -n "$DB_URL" ] && $PG/psql "$DB_URL" -tAc "select value from public.app_settings where key = 'maindb:state'" | grep -q '"done"'; then
            moved=2                 # moved, but Railway isn't reachable from here: its own volume backups hold the data
          fi
          if [ "$moved" = 1 ]; then
            # users' data on Railway, whole; the market data too on full days
            schemas=(-n app); [ "$full" = 1 ] && schemas+=(-n public)
            $PG/pg_dump "$APP_DB_URL" -Fc -Z 6 --no-owner --no-privileges "${schemas[@]}" -f out/app.dump
          elif [ "$moved" = 2 ]; then
            # Supabase's tables are the copy from before the move: not worth keeping (nor its egress); only the sign-ins
            echo "::notice::Users' data is on Railway (Railway → Postgres → Backups keeps it); this copy has the sign-ins only."
          else
            # before the move: the app's tables in Supabase, whole: users' data, payments, settings
            skip=(); [ "$full" = 1 ] || skip=(--exclude-table-data=public.option_snapshots)
            $PG/pg_dump "$DB_URL" -Fc -Z 6 --no-owner --no-privileges -n public "${skip[@]}" -f out/app.dump
          fi
          # the sign-ins (who has an account), as data to load back into a fresh Supabase project
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL isn't set, so the sign-ins (auth.users) weren't copied; the app's data was."
          elif ! $PG/pg_dump "$DB_URL" -Fc -Z 6 --data-only --no-owner --no-privileges -t auth.users -t auth.identities -f out/auth.dump; then
            echo "::warning::The sign-ins (auth.users) couldn't be copied; the app's own tables were."
            rm -f out/auth.dump
          fi
          if [ -z "$(ls out)" ]; then
            echo "::error::Nothing was copied."
            exit 1
          fi
          tar -C out -cf - . | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "stratlab-db-$day.tar.gpg"
          ls -l stratlab-db-*.tar.gpg
          echo "NAME=stratlab-db-$day$([ "$full" = 1 ] && echo -full || true)" >> "$GITHUB_ENV"
          echo "KEEP=$([ "$full" = 1 ] && echo 28 || echo 7)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: stratlab-db-*.tar.gpg
          retention-days: ${{ env.KEEP }}
          compression-level: 0
          if-no-files-found: error
