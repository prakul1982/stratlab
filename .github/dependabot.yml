version: 2
updates:
  - package-ecosystem: pip
    directory: /stratlab/backend
    schedule: { interval: weekly }
    # paused for the public launch (owner, 22 Oct 2026): no new update PRs until it settles; set back to 5 after
    open-pull-requests-limit: 0
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # pinned by kiteconnect; see "Known limits" in stratlab/README.md
      - dependency-name: autobahn
      # major versions can break the engine or billing: upgrade those by hand
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /stratlab/frontend
    schedule: { interval: weekly }
    # paused for the public launch (owner, 22 Oct 2026): no new update PRs until it settles; set back to 5 after
    open-pull-requests-limit: 0
    ignore:
      # React, TypeScript and Vite majors need a hand-checked upgrade
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0     # paused for the launch too
