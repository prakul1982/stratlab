<style>
/* the plain page: shown while the app starts, and if it never does (a script that failed to download, JavaScript turned off). It
 * wears the app's own paper, ink and card, in both themes, so a failed start still looks like StratLab and is readable in the
 * dark (RC7-001: pale text on a white page when the device was dark); the same values as src/styles.css's tokens. */
:root { --b-paper: #F5F1E8; --b-card: #FFFDF8; --b-ink: #1D1B17; --b-muted: #5C574D; --b-line: #E2DAC8; --b-on-ink: #F5F1E8; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --b-paper: #141311; --b-card: #1F1D1A; --b-ink: #EFE9DC; --b-muted: #B3AC9C; --b-line: #34312A; --b-on-ink: #141311; color-scheme: dark; } }
:root[data-theme="dark"] { --b-paper: #141311; --b-card: #1F1D1A; --b-ink: #EFE9DC; --b-muted: #B3AC9C; --b-line: #34312A; --b-on-ink: #141311; color-scheme: dark; }
html, body { margin: 0; background: var(--b-paper); }
.boot-head { max-width: 720px; margin: 0 auto; padding: 14px 16px; font: 600 18px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
.boot-head a { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--b-ink); text-decoration: none; }
.boot-head img { width: 28px; height: 28px; }
.boot { max-width: 520px; margin: 0 auto; padding: 18vh 16px 0; display: flex; flex-direction: column; gap: 12px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--b-ink); }
.boot h1 { font: 600 28px/1.2 Georgia, serif; margin: 0; }
.boot h2 { font: 600 18px/1.3 Georgia, serif; margin: 8px 0 0; }
.boot p { margin: 0; }
.boot a { color: inherit; }
/* the notice itself (couldn't load, taking longer): a card on the paper with the logo, the way the app's own messages look */
.boot.boot-now { box-sizing: border-box; max-width: min(520px, calc(100% - 32px)); margin: 18vh auto 0; padding: 24px; background: var(--b-card); border: 1px solid var(--b-line); border-radius: 14px; }
.boot.boot-now.boot-above { margin-top: 16px; }
.boot-now .boot-brand { display: inline-flex; align-items: center; gap: 10px; font: 600 17px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--b-muted); }
.boot-now .boot-brand img { width: 24px; height: 24px; }
.boot-now p { color: var(--b-muted); }
/* the start-up page's policy links, which stay when the app can't load: big enough to tap (R68-005: 19 px tall) */
.boot-foot a { display: inline-block; padding: 12px 4px; }
.boot[data-readable] { max-width: 720px; padding-top: 8px; padding-bottom: 48px; }
.boot[data-readable] ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.boot ul.boot-links { padding: 0; list-style: none; flex-direction: row; flex-wrap: wrap; gap: 12px; }
.boot ul.boot-links a { display: inline-block; padding: 12px 18px; border: 1px solid currentColor; border-radius: 10px; text-decoration: none; font-weight: 600; }
.boot-btn, .boot a.boot-btn { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: var(--b-ink); color: var(--b-on-ink); font: 600 15px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
.boot-btn:focus-visible { outline: 2px solid var(--b-ink); outline-offset: 3px; }
/* the app's own error message is on the page: the start-up script's notice above it would say the same twice (R68-004) */
body:has(#root [role="alert"]) > main > .boot-now { display: none; }
.boot-wait { opacity: 0; animation: boot-in .2s ease .6s forwards; }
@keyframes boot-in { to { opacity: 1; } }
html[data-saved] [data-boot] > * { display: none; }
html[data-saved] [data-boot]::before { content: "Opening StratLab…"; font: 600 18px/1.3 Georgia, serif; }
