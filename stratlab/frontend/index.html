<style>
/* the plain page: shown while the app starts, and if it never does (a script that failed to download, JavaScript turned off). It
 * wears the app's own paper, ink and card, in both themes, so a failed start still looks like StratLab and is readable in the
 * dark (RC7-001: pale text on a white page when the device was dark); the same values as src/styles.css's tokens. */
:root { --b-paper: #F5F1E8; --b-card: #FFFDF8; --b-ink: #1D1B17; --b-muted: #5C574D; --b-line: #E2DAC8; --b-on-ink: #F5F1E8; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --b-paper: #141311; --b-card: #1F1D1A; --b-ink: #EFE9DC; --b-muted: #B3AC9C; --b-line: #34312A; --b-on-ink: #141311; color-scheme: dark; } }
:root[data-theme="dark"] { --b-paper: #141311; --b-card: #1F1D1A; --b-ink: #EFE9DC; --b-muted: #B3AC9C; --b-line: #34312A; --b-on-ink: #141311; color-scheme: dark; }
html, body { margin: 0; background: var(--b-paper); }
.boot-head { max-width: 720px; margin: 0 auto; padding: 14px 16px; font: 600 18px/1 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-wrap: wrap; align-items: center; column-gap: 20px; }
/* LIVE13B-001: the home page while its code downloads is the landing's own header and hero (scripts/seoPages.mjs heroFrame), drawn
 * with the app's stylesheet, which the head links before the page draws: the same classes, so the same column, wrap and place, and
 * nothing moves when the app draws. Its lede and buttons are for a browser that runs scripts; the page's own paragraphs and links are
 * for one that doesn't (and for crawlers, which read every word). Only on the home address: another address served this file (a
 * visitor's /trade, before its sign-in panel) shows the header and the heading, not the landing's lede and buttons (boot.js sets data-home). */
.boot-demo { display: none; }
@media (scripting: none) { .boot-hero .boot-js { display: none; } }
@media (scripting: enabled) {
  .boot-hero .boot-text, .boot-hero ul.boot-links.boot-text { display: none; }
  html:not([data-home]) .boot-hero .boot-js, html:not([data-home]) .boot-demo { display: none; }
  /* the example card beside the heading on a wide screen, its usual height held, so the heading sits where the card centres it */
  @media (min-width: 1001px) { .boot-demo { display: block; min-height: 689px; } }
}
/* LIVE14A-014 / LIVE14B-003: the landing's hero words (the start-up frame's and the app's, the same .lp-hero-copy) are not painted until
 * their own faces are here (public/boot.js sets data-faces): painted first in a stand-in serif (Georgia, DejaVu Serif: whatever the device
 * has), the app's hero drawn later in Fraunces was a larger paint, so it became the LCP (2.8 s), and the swap moved the phone's lede (CLS
 * 0.026). Hidden, they are laid out but never shown in the stand-in, so no device's fonts decide where anything sits; at most 3 s, the
 * browser's own wait for a font (font-display: block), if the faces never come. */
@media (scripting: enabled) { html[data-home]:not([data-faces]) .lp-hero-copy { visibility: hidden; animation: boot-faces 0s 3s forwards; } }
@keyframes boot-faces { to { visibility: visible; } }
/* LIVE16B-001: the sign-in page while its code downloads is the sign-in page itself (scripts/seoPages.mjs loginFrame): Google and the email
 * form at once. Its words for a reader with no script (who can't sign in) show only then; with email sign-in off in /config.js,
 * public/signin-early.js marks the page and the email way goes. */
@media (scripting: enabled) { .boot-login .boot-text { display: none; } }
@media (scripting: none) { .boot-login [data-boot-google], .boot-login [data-boot-email] { display: none; } }
html[data-email-off] .boot-login [data-boot-email], html[data-email-off] .boot-login [data-boot-or] { display: none; }
.boot-login .boot-foot a { color: inherit; }
/* scripts off: the page's links as one row of buttons under the words */
.boot-hero ul.boot-links { display: flex; flex-wrap: wrap; gap: 12px; margin: 0; padding: 0; list-style: none; }
.boot-hero ul.boot-links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid var(--line-2, currentColor); border-radius: 10px; color: inherit; text-decoration: none; font-weight: 600; }
.boot-hero .boot-foot { color: var(--muted, inherit); }
.boot-hero .boot-foot a { color: inherit; }
/* the site's public pages, for a reader or a crawler that runs no script (AS1): the same list as the pages the server draws */
.boot-head .boot-nav { display: flex; flex-wrap: wrap; column-gap: 14px; font: 500 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
.boot-head .boot-nav a { gap: 0; color: var(--b-muted); }
.boot-head a { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--b-ink); text-decoration: none; }
.boot-head img { width: 28px; height: 28px; }
.boot { max-width: 520px; margin: 0 auto; padding: 18vh 16px 0; display: flex; flex-direction: column; gap: 12px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--b-ink); }
.boot h1 { font: 600 28px/1.2 Georgia, serif; margin: 0; }
.boot h2 { font: 600 18px/1.3 Georgia, serif; margin: 8px 0 0; }
.boot p { margin: 0; }
.boot a { color: inherit; }
/* the notice itself (couldn't load, taking longer): a card on the paper with the logo, the way the app's own messages look */
.boot.boot-now { box-sizing: border-box; max-width: min(520px, calc(100% - 32px)); margin: 18vh auto 0; padding: 24px; background: var(--b-card); border: 1px solid var(--b-line); border-radius: 14px; }
.boot.boot-now.boot-above { margin-top: 16px; }
/* scripts off: why nothing works, said first, above the page's words (LIVE13B-002: it came last, after six paragraphs), on the page's own
 * column (LIVE14A-022 / LIVE14B-004: centred at 720 px, its edges matched nothing under it) */
.boot[data-js-off] { box-sizing: border-box; max-width: min(1100px, calc(100% - 2 * clamp(16px, 4vw, 40px))); margin: 16px auto; padding: 16px 20px; gap: 8px; background: var(--b-card); border: 1px solid var(--b-line); border-radius: 14px; }
.boot-now .boot-brand { display: inline-flex; align-items: center; gap: 10px; font: 600 17px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--b-muted); }
.boot-now .boot-brand img { width: 24px; height: 24px; }
.boot-now p { color: var(--b-muted); }
/* the start-up page's policy links, which stay when the app can't load: big enough to tap (R68-005: 19 px tall) */
.boot-foot a { display: inline-block; padding: 12px 4px; }
.boot[data-readable] { max-width: 720px; padding-top: 8px; padding-bottom: 48px; }
.boot[data-readable] ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.boot ul.boot-links { padding: 0; list-style: none; flex-direction: row; flex-wrap: wrap; gap: 12px; }
.boot ul.boot-links a { display: inline-block; padding: 12px 18px; border: 1px solid currentColor; border-radius: 10px; text-decoration: none; font-weight: 600; }
.boot-btn, .boot a.boot-btn { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: var(--b-ink); color: var(--b-on-ink); font: 600 15px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
.boot-btn:focus-visible { outline: 2px solid var(--b-ink); outline-offset: 3px; }
/* the app's own error message is on the page: the start-up script's notice above it would say the same twice (R68-004) */
body:has(#root [role="alert"]) > main > .boot-now { display: none; }
.boot-wait { opacity: 0; animation: boot-in .2s ease .6s forwards; }
@keyframes boot-in { to { opacity: 1; } }
html[data-saved] [data-boot] > * { display: none; }
html[data-saved] [data-boot]::before { content: "Opening StratLab…"; font: 600 18px/1.3 Georgia, serif; }
</style>
